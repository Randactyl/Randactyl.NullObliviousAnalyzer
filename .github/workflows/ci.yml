name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git-cliff needs the history and tags
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - run: dotnet build Randactyl.NullObliviousAnalyzer.slnx --no-incremental
      - run: dotnet test
      - run: dotnet pack src/Randactyl.NullObliviousAnalyzer -c Release -o artifacts/pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/pkg/*.nupkg
          if-no-files-found: error
      - name: Preview release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - run: cat RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

  # Installs the packed analyzer into a throwaway project on each supported SDK.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["10", "11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.sdk }}.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg
      - name: Smoke test
        run: |
          version=$(basename pkg/*.nupkg .nupkg | sed 's/^Randactyl\.NullObliviousAnalyzer\.//')
          eng/smoke-test.sh pkg "$version" "${{ matrix.sdk }}"
